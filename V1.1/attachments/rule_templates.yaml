# AI电子硬件可靠性分析系统 - 分层规则标准模板 V1.1-ER-r3
# 对应 02 §2.2 三类 rule_type；rule.schema.json（r3）为机读约束。
# 模板为「示意级起点」：阈值必须来自具体料号手册/适用标准/企业规范（02 §2），不得把示例值当行业限值。
# r3 修复：日期全部加引号（string）、status=published、evidence 补全、preconditions 数组化（DSL+on_fail）、
#         thresholds variants、tests >=3 且 kind 覆盖 normal/boundary/invalid、温度 quantity_kind 显式、插件参数带单位、状态机四态。

- rule_id: ELEC-RES-PWR-001
  rule_type: declarative_expr
  domain: derating
  title: 厚膜片式电阻稳态功耗降额审查
  intent: 检查电阻在工作环境下的稳态耗散功率是否满足降额要求
  applicability:
    component_category: Resistor
    sub_category: Thick_Film_Chip
  inputs:
    - {name: power_dissipation, unit: W, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: rated_power_70c, unit: W, required: true, source: "Component.rated_params", quantity_kind: absolute}
    - {name: local_ambient_temp, unit: degC, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: derating_ratio_limit, unit: ratio, required: true, source: Thresholds, quantity_kind: absolute}
  preconditions:
    - {expr: "local_ambient_temp <= 70", on_fail: SKIPPED_PRECONDITION}
  expression: "(power_dissipation / rated_power_70c) <= derating_ratio_limit"
  thresholds:
    derating_ratio_limit:
      variants:
        - {condition: "profile=default", value: 0.50, unit: ratio}
        - {condition: "profile=high_reliability", value: 0.40, unit: ratio}
      source_ref: "EVD-STD-012"
      applicability_note: "企业元器件降额规范 Q/XXX-2026 第4.2条（示意占位；待企业批准）"
  severity: high
  rationale: 电阻长期工作在接近额定功率下会导致阻值漂移、焊点热疲劳及基板碳化
  recommendation: 更换更大封装尺寸（提高额定功率）或采用多颗电阻串并联分担功耗
  evidence:
    - evidence_id: EVD-STD-012
      level: A
      publisher: "（示例）企业标准化委员会"
      title: "企业元器件降额规范 Q/XXX-2026"
      version_date: "2026-01-15"
      locator: "Section 4.2, Table 3"
      limitations: "示意占位；正式版须替换为企业受控文件"
  evidence_level: A
  owner: "张工(器件工程)"
  reviewer: "李工(可靠性负责人)"
  version: "1.1.0"
  status: draft
  effective_date: "2026-11-21"
  expiry_date: "2028-11-21"
  tests:
    - name: 正常50%降额边界通过
      kind: boundary
      inputs: {power_dissipation: 0.05, rated_power_70c: 0.1, local_ambient_temp: 55, derating_ratio_limit: 0.5}
      expected_pass: true
      expected_status: PASS
    - name: 超降额阈值判失败
      kind: invalid
      inputs: {power_dissipation: 0.08, rated_power_70c: 0.1, local_ambient_temp: 55, derating_ratio_limit: 0.5}
      expected_pass: false
      expected_status: FAIL
    - name: 超温条件跳过（交由高温折减规则）
      kind: normal
      inputs: {power_dissipation: 0.04, rated_power_70c: 0.1, local_ambient_temp: 85, derating_ratio_limit: 0.5}
      expected_status: SKIPPED_PRECONDITION
  notes: "本规则只覆盖 70℃ 以下稳态工况；>70℃ 场景由温度折减曲线规则（lookup_curve）承接。"

- rule_id: ELEC-MOS-SOA-002
  rule_type: lookup_curve
  domain: power
  title: MOSFET 脉冲启动瞬间 SOA 安全工作区包络审查
  intent: 验证电源热插拔或容性负载启动时，MOSFET 的 VDS-ID-脉冲宽度工作点是否落在厂商 SOA 曲线内
  applicability:
    component_category: MOSFET
    operating_mode: [Linear_Mode, Inrush_Startup]
  inputs:
    - {name: peak_vds, unit: V, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: peak_id, unit: A, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: pulse_width_ms, unit: ms, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: case_temp, unit: degC, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: soa_curve_table, unit: table, required: true, source: "Component.datasheet_curves", quantity_kind: absolute}
  preconditions:
    - {expr: "soa_curve_table != null", on_fail: DATA_GAP}
  curve_eval:
    interpolation: log_log_linear
    table_columns: {x: pulse_width_ms, y: max_id}   # v1 单族 1D 插值；多族 2D（VDS 轴）留 V2
    target_var: peak_id                              # 与 limit 比较的目标变量（inputs 声明单位口径）
    temp_var: case_temp                              # 温度折减的温度变量（显式声明，复审 P2）
    # 温度折减按绝对温差（delta, 单位 K）计算：delta_T = case_temp - 25；折减因子 = 1 - delta_T/125
    temp_derating_delta_ref_c: 25
    temp_derating_delta_max_c: 125
    temp_derating_factor: "1 - ((case_temp - 25) / 125)"   # 人读描述（v1 引擎按 delta_ref/max_c 执行，本字段不执行）
    safety_margin_ratio: 0.80
    curve_out_of_bounds: error
  severity: critical
  rationale: 线性区启动时局部热点集中（Spirito 效应），易引发二次击穿导致 MOSFET 短路烧毁
  recommendation: 增大栅极电容减缓导通速度、选用 SOA 更宽的器件，或增加预充电限流电路
  evidence:
    - evidence_id: EVD-DS-MOS882
      level: A
      publisher: "（示例）MOS882 制造商"
      title: "MOS882 Datasheet"
      version_date: "2026-05-20"
      locator: "Fig.11 Maximum Safe Operating Area"
      limitations: "SOA 曲线为 TC=25℃ 基准；曲线表由 01 §7A 管线提取并人工校对"
  evidence_level: A
  owner: "王工(电源可靠性)"
  reviewer: "李工(可靠性负责人)"
  version: "1.1.0"
  status: draft
  effective_date: "2026-11-21"
  expiry_date: "2027-11-21"
  tests:
    - name: 10ms脉冲在25℃下处于80%包络内
      kind: normal
      inputs: {peak_vds: 24, peak_id: 4.5, pulse_width_ms: 10, case_temp: 25, soa_curve_table: MOCK_SOA_10A_AT_24V_10MS}
      expected_pass: true
      expected_status: PASS
    - name: 边界——工作点恰在折减后包络线
      kind: boundary
      inputs: {peak_vds: 24, peak_id: 8.0, pulse_width_ms: 10, case_temp: 25, soa_curve_table: MOCK_SOA_10A_AT_24V_10MS}
      expected_pass: true
      expected_status: PASS
    - name: 超包络判 Critical 失败
      kind: invalid
      inputs: {peak_vds: 24, peak_id: 9.5, pulse_width_ms: 10, case_temp: 25, soa_curve_table: MOCK_SOA_10A_AT_24V_10MS}
      expected_pass: false
      expected_status: FAIL
  notes: "温度折减因子手算复核：case_temp=25 → factor=1.00；85 → 0.52；150 → 0.00（三组用例进 CI）。"

- rule_id: ELEC-ECAP-LIFE-003
  rule_type: script_plugin
  domain: derating
  title: 铝电解电容纹波温升与预期寿命评估
  intent: 基于纹波电流自发热与环境温度，按制造商寿命倍增模型计算预期使用寿命
  applicability:
    component_category: Capacitor
    sub_category: Aluminum_Electrolytic
  inputs:
    - {name: ripple_current_rms, unit: A, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: esr_at_freq, unit: ohm, required: true, source: "Component.rated_params", quantity_kind: absolute}
    - {name: thermal_resistance_ca, unit: degC_per_W, required: true, source: "Component.rated_params", quantity_kind: delta}
    - {name: local_ambient_temp, unit: degC, required: true, source: ComponentStress, quantity_kind: absolute}
    - {name: rated_max_temp, unit: degC, required: true, source: "Component.rated_params", quantity_kind: absolute}
    - {name: rated_endurance_hours, unit: h, required: true, source: "Component.rated_params", quantity_kind: absolute}
    - {name: product_lifetime_target, unit: h, required: true, source: OperatingProfile, quantity_kind: absolute}
  preconditions:
    - {expr: "local_ambient_temp <= rated_max_temp", on_fail: NOT_APPLICABLE}
  plugin_ref:
    module: "reliability_calc.capacitors.ecap_arrhenius_v1"
    entry_func: "evaluate_ecap_lifetime"
    digest: "sha256:local-dev"
    params:
      doubling_temp_delta: {value: 10.0, unit: K, quantity_kind: delta, source: "器件手册专属参数优先；默认基线", approval: "待领域 Owner 确认"}
      life_safety_factor: {value: 1.2, unit: ratio, quantity_kind: absolute, source: "企业设计裕度规范（示意）", approval: "待可靠性负责人批准"}
    verdict_expr: "predicted_life_hours >= product_lifetime_target * life_safety_factor"
  outputs_exposed:
    - {name: core_temp_est, unit: degC, type: number, quantity_kind: absolute}
    - {name: predicted_life_hours, unit: h, type: number, quantity_kind: absolute}
  severity: high
  rationale: 电解液干涸速率随芯温呈指数上升，高频纹波引发的 ESR 损耗是高温失效主因
  recommendation: 选用低 ESR 型号、多颗电容并联降低单颗纹波电流，或远离功率电感/散热器布局
  evidence:
    - evidence_id: EVD-APP-NIC04
      level: A
      publisher: "（示例）电容制造商"
      title: "Aluminum Electrolytic Capacitor Application Guide"
      version_date: "2025-08-01"
      locator: "p.14"
      limitations: "倍增温度以器件手册为准；通用指南值为默认基线"
  evidence_level: A
  owner: "张工(器件工程)"
  reviewer: "李工(可靠性负责人)"
  version: "1.1.0"
  status: draft
  effective_date: "2026-11-21"
  expiry_date: "2028-11-21"
  tests:
    - name: 标准105℃/2000h电容在65℃下寿命计算验证（手算基准：66℃/29863h）
      kind: normal
      inputs: {ripple_current_rms: 0.5, esr_at_freq: 0.1, thermal_resistance_ca: 40, local_ambient_temp: 65, rated_max_temp: 105, rated_endurance_hours: 2000, product_lifetime_target: 20000}
      expected_pass: true
      expected_status: PASS
      expected_outputs: {core_temp_est: 66.0, predicted_life_hours: 29863.0}
      tolerance_rel: 0.001
    - name: 边界——环境温度等于额定温度（纹波为零，寿命=额定，但低于产品目标判 FAIL）
      kind: boundary
      inputs: {ripple_current_rms: 0.0, esr_at_freq: 0.1, thermal_resistance_ca: 40, local_ambient_temp: 105, rated_max_temp: 105, rated_endurance_hours: 2000, product_lifetime_target: 20000}
      expected_pass: false
      expected_status: FAIL
    - name: 异常——环境温度超额定（前置 NOT_APPLICABLE）
      kind: invalid
      inputs: {ripple_current_rms: 0.5, esr_at_freq: 0.1, thermal_resistance_ca: 40, local_ambient_temp: 110, rated_max_temp: 105, rated_endurance_hours: 2000, product_lifetime_target: 20000}
      expected_status: NOT_APPLICABLE
  notes: "手算复核：P_ripple=I^2·ESR=0.025W；ΔT=0.025×40=1.0℃；芯温=66℃；寿命=2000×2^((105-66)/10)=2000×14.93≈29863h。"
