[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-tri-engine"
version = "0.1.0"
description = "Deterministic, unit-aware reliability rule execution engine"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
reliability-rule-run = "reliability_engine.cli:main"
