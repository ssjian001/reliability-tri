[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-tri-engine"
version = "0.2.0"
description = "Deterministic, unit-aware reliability rule execution engine"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.4,<3.0",
  "jsonschema>=4.20,<5.0",
  "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reliability_api = ["schema/*.json"]

[project.scripts]
reliability-rule-run = "reliability_engine.cli:main"
reliability-api-init-db = "reliability_api.cli:main"
